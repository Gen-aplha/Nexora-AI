<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101225">
<title>NEXORA AI</title>
<style>
:root{color-scheme:dark;--bg:#0c0e1d;--panel:#12152a;--panel2:#1b1f3a;--text:#f5f6ff;--muted:#9da5dc;--line:rgba(139,111,255,.22);--accent:#6d3cff;--accent2:#c13cff;--good:#00d49a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 80% 0%,#1a1740 0%,transparent 38%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}
button,textarea{font:inherit}
button{cursor:pointer}
.history-tools{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 10px}
.history-tools button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:9px;padding:8px 6px;font-size:11px}
.history-tools button:last-of-type{grid-column:1/-1}
.message-actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.message-actions button{border:1px solid var(--line);background:var(--panel2);color:var(--muted);border-radius:8px;padding:5px 9px;font-size:11px}
.message-actions button:active,.history-tools button:active{opacity:.75}
.voice-controls{display:flex;align-items:center;gap:5px}
.voice-language{max-width:86px;height:38px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:11px;padding:0 3px}
@media(max-width:420px){.voice-language{max-width:70px}.voice-btn{width:38px;height:38px}}

.voice-btn{flex-shrink:0;width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--panel2);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:18px}
.voice-btn.listening{background:#a92346;border-color:#ff7895;box-shadow:0 0 0 3px rgba(255,90,130,.18)}
.voice-btn:disabled{opacity:.55;cursor:not-allowed}
.voice-status{font-size:11px;color:var(--muted);text-align:center;min-height:15px;margin-top:5px}
.bubble h1,.bubble h2,.bubble h3{line-height:1.3;margin:1em 0 .45em}
.bubble h1{font-size:1.35em}.bubble h2{font-size:1.2em}.bubble h3{font-size:1.08em}
.bubble p{margin:.45em 0;line-height:1.6}.bubble ul,.bubble ol{padding-left:1.5em;margin:.5em 0}
.bubble li{margin:.25em 0}.bubble blockquote{border-left:3px solid #9b70ff;margin:.6em 0;padding:.2em .8em;color:var(--muted)}
.bubble pre{overflow:auto;background:#090b18;color:#e8e9ff;border:1px solid rgba(139,111,255,.25);border-radius:10px;padding:12px;margin:.7em 0;white-space:pre}
.bubble pre code{background:none;padding:0;color:inherit}
.bubble :not(pre)>code{background:rgba(120,100,255,.17);padding:.12em .35em;border-radius:5px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
.bubble hr{border:0;border-top:1px solid var(--line);margin:1em 0}
.app{height:100dvh;display:flex}
.sidebar{width:270px;flex-shrink:0;border-right:1px solid var(--line);background:rgba(9,11,26,.85);display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 24px}
.brand-name{font-weight:850;font-size:23px;letter-spacing:1px;white-space:nowrap}.brand-name span{color:#bb55ff}
.logo-mark{width:48px;height:48px;flex-shrink:0;display:block;filter:drop-shadow(0 0 10px rgba(120,66,255,.25))}
.new-chat,.nav-btn{border:1px solid transparent;color:var(--text);background:transparent;border-radius:13px;padding:12px 13px;display:flex;align-items:center;gap:12px;text-align:left;width:100%;font-size:15px}
.new-chat{background:linear-gradient(110deg,rgba(105,57,255,.25),rgba(184,54,255,.12));border-color:var(--line);margin-bottom:18px}
.nav-btn{color:var(--muted);margin:3px 0}.nav-btn.active,.nav-btn:hover{background:rgba(100,65,220,.22);color:white}
.nav-icon{font-size:20px;width:25px;text-align:center}
.history-heading{font-size:10px;letter-spacing:1.5px;color:#747da9;font-weight:750;padding:18px 12px 7px}
.history-list{display:flex;flex-direction:column;gap:4px;overflow-y:auto;max-height:38vh}
.history-item{display:flex;align-items:center;gap:7px;width:100%;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:10px;padding:9px 10px;text-align:left;font-size:13px}
.history-item span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.history-item.active,.history-item:hover{background:rgba(100,65,220,.2);border-color:var(--line);color:var(--text)}
.history-delete{border:0;background:transparent;color:#858bb4;padding:3px 5px;border-radius:6px;font-size:15px}
.history-delete:hover{color:#ff8caa;background:#3a203d}
.side-bottom{margin-top:auto;color:var(--muted);font-size:13px;line-height:1.65;padding:14px 8px}
.main{min-width:0;flex:1;display:flex;flex-direction:column}
.topbar{height:82px;display:flex;align-items:center;gap:13px;padding:14px 24px;border-bottom:1px solid var(--line);background:rgba(13,15,34,.68)}
.menu-btn{display:none}
.topbrand{display:flex;align-items:center;gap:12px}.topbrand .logo-mark{width:49px;height:49px}
.topbrand h1{font-size:19px;margin:0 0 3px}.topbrand p{margin:0;color:var(--muted);font-size:13px}
.status{margin-left:auto;color:var(--good);font-size:13px;display:flex;align-items:center;gap:8px}.dot{height:8px;width:8px;background:var(--good);border-radius:50%;box-shadow:0 0 10px var(--good)}
.chat{flex:1;overflow-y:auto;padding:28px clamp(16px,5vw,70px) 24px;scroll-behavior:smooth}
.welcome{max-width:680px;margin:12vh auto 0;text-align:center}.welcome .logo-mark{width:78px;height:78px;margin:0 auto 15px}.welcome h2{font-size:clamp(27px,4vw,38px);margin:0 0 10px;letter-spacing:-.7px}.gradient{background:linear-gradient(90deg,#77d9ff,#a77bff,#e05cff);-webkit-background-clip:text;background-clip:text;color:transparent}.welcome p{color:var(--muted);line-height:1.65;margin:0 auto 24px;max-width:460px}
.suggestions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.suggestion{background:rgba(28,31,60,.8);border:1px solid var(--line);border-radius:14px;color:#dfe1ff;padding:10px 13px;font-size:13px}.suggestion:hover{border-color:#8b61ff;background:#252047}
.message-row{display:flex;align-items:flex-start;gap:11px;margin:0 auto 23px;max-width:850px}.message-row.user{justify-content:flex-end}.message-row .logo-mark{width:38px;height:38px;margin-top:2px}.bubble-wrap{max-width:min(78%,700px)}.bubble{padding:13px 16px;border-radius:18px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}.bot .bubble{background:linear-gradient(135deg,rgba(30,34,66,.96),rgba(27,30,57,.95));border:1px solid var(--line);border-top-left-radius:5px}.user .bubble{background:linear-gradient(125deg,#613cff,#963cff);border-top-right-radius:5px}.meta{font-size:11px;color:var(--muted);margin:5px 5px 0}.user .meta{text-align:right}
.composer-wrap{padding:12px clamp(12px,4vw,50px) 18px;background:linear-gradient(transparent,rgba(10,12,28,.88) 25%)}
.composer{max-width:930px;margin:auto;display:flex;align-items:flex-end;gap:10px;padding:10px 11px 10px 18px;border:1px solid rgba(130,91,255,.45);border-radius:22px;background:rgba(25,28,54,.95);box-shadow:0 0 0 5px rgba(87,53,190,.08)}
textarea{flex:1;resize:none;max-height:150px;min-height:42px;padding:10px 0;border:0;outline:0;background:transparent;color:var(--text);line-height:1.5}textarea::placeholder{color:#8992cb}
.send{width:45px;height:45px;border:0;border-radius:15px;color:white;background:linear-gradient(135deg,#563cff,#a132ff);font-size:20px;box-shadow:0 4px 16px rgba(107,54,255,.3)}.send:disabled{opacity:.55}
.footnote{text-align:center;color:#717aa9;font-size:11px;margin-top:9px}
.typing{display:inline-flex;gap:5px;padding:6px 2px}.typing i{width:6px;height:6px;background:#a79aff;border-radius:50%;animation:pulse 1s infinite alternate}.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}@keyframes pulse{to{opacity:.25;transform:translateY(-3px)}}
@media(max-width:680px){.sidebar{position:fixed;z-index:5;inset:0 auto 0 0;width:270px;transform:translateX(-105%);transition:transform .2s;box-shadow:20px 0 60px #0008}.sidebar.open{transform:translateX(0)}.menu-btn{display:block;border:1px solid var(--line);background:var(--panel2);color:white;border-radius:10px;padding:8px 11px}.topbar{height:70px;padding:10px 13px}.topbrand .logo-mark{width:42px;height:42px}.topbrand h1{font-size:16px}.topbrand p{font-size:11px}.status{font-size:11px}.chat{padding:22px 13px}.welcome{margin-top:9vh}.bubble-wrap{max-width:86%}.composer-wrap{padding:8px 10px 12px}.composer{border-radius:18px}.footnote{font-size:10px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="logo-mark" viewBox="0 0 100 100" role="img" aria-label="NEXORA logo">
        <defs><linearGradient id="ng1" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#287dff"/><stop offset=".52" stop-color="#9b45ff"/><stop offset="1" stop-color="#ed63ff"/></linearGradient></defs>
        <rect x="3" y="3" width="94" height="94" rx="28" fill="#24135a" stroke="#7042e8" stroke-opacity=".55"/>
        <path d="M24 72V28L76 72V28" fill="none" stroke="url(#ng1)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M24 28L76 72" fill="none" stroke="#7c54ff" stroke-width="7" stroke-linecap="round" opacity=".45"/>
      </svg>
      <div class="brand-name">NEXORA <span>AI</span></div>
    </div>
    <button class="new-chat" id="newChat"><span class="nav-icon">＋</span> New chat</button>
    <button class="nav-btn active"><span class="nav-icon">▤</span> Chat</button>
    <div class="history-heading">RECENT CHATS</div>
    <div id="historyList" class="history-list"></div>
    <div class="history-tools">
      <button type="button" id="exportChatsBtn">⇩ Export chats</button>
      <button type="button" id="importChatsBtn">⇧ Import chats</button>
      <button type="button" id="clearChatsBtn">✕ Clear all chats</button>
      <input type="file" id="importChatsFile" accept="application/json,.json" hidden>
    </div>
    <button class="nav-btn" id="exploreBtn"><span class="nav-icon">✧</span> Explore</button>
    <button class="nav-btn" id="themeBtn"><span class="nav-icon">☾</span> Toggle theme</button>
    <div class="side-bottom">Smarter Conversations.<br>A Brighter Tomorrow. <span style="color:#c34cff">♥</span><br><small>Powered by NEXORA AI</small></div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <div class="topbrand">
        <svg class="logo-mark" viewBox="0 0 100 100" role="img" aria-label="NEXORA logo">
          <defs><linearGradient id="ng2" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#287dff"/><stop offset=".52" stop-color="#9b45ff"/><stop offset="1" stop-color="#ed63ff"/></linearGradient></defs>
          <rect x="3" y="3" width="94" height="94" rx="28" fill="#24135a" stroke="#7042e8" stroke-opacity=".55"/>
          <path d="M24 72V28L76 72V28" fill="none" stroke="url(#ng2)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div><h1>NEXORA AI</h1><p>Your AI assistant</p></div>
      </div>
      <div class="status"><span class="dot"></span> Online</div>
    </header>
    <section class="chat" id="chat" aria-live="polite">
      <div class="welcome" id="welcome">
        <svg class="logo-mark" viewBox="0 0 100 100" role="img" aria-label="NEXORA logo">
          <defs><linearGradient id="ng3" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#287dff"/><stop offset=".52" stop-color="#9b45ff"/><stop offset="1" stop-color="#ed63ff"/></linearGradient></defs>
          <rect x="3" y="3" width="94" height="94" rx="28" fill="#24135a" stroke="#7042e8" stroke-opacity=".55"/>
          <path d="M24 72V28L76 72V28" fill="none" stroke="url(#ng3)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h2>Meet your AI assistant</h2>
        <p>Ask questions, explore ideas, learn something new, or get help with your next project.</p>
        <div class="suggestions">
          <button class="suggestion">Explain AI simply</button>
          <button class="suggestion">Give me a project idea</button>
          <button class="suggestion">Help me learn coding</button>
        </div>
      </div>
    </section>
    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <textarea id="messageInput" rows="1" placeholder="Message NEXORA AI..." aria-label="Your message"></textarea>
        <select id="voiceLanguage" class="voice-language" aria-label="Voice recognition language" title="Voice language">
          <option value="en-IN">English IN</option><option value="hi-IN">हिन्दी</option><option value="en-US">English US</option><option value="mr-IN">मराठी</option>
        </select>
        <button class="voice-btn" id="voiceBtn" type="button" aria-label="Start voice input" title="Speak your message">🎙️</button>
        <button class="send" id="sendBtn" type="submit" aria-label="Send message">➤</button>
      </form>
      <div class="voice-status" id="voiceStatus" aria-live="polite"></div>
      <div class="footnote">NEXORA AI can make mistakes. Check important information.</div>
    </div>
  </main>
</div>
<script>
const API_URL = "https://nexora-ai-backend.mayankhindubro.workers.dev";
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");
const form = document.getElementById("chatForm");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const sidebar = document.getElementById("sidebar");
const historyList = document.getElementById("historyList");
const STORAGE_KEY = "nexora_ai_chat_sessions_v1";
let busy = false;
let sessions = loadSessions();
let activeSessionId = null;

// Voice input uses the browser's Web Speech API when available.
// Recognition is local to the browser interface; the recognized text is only sent
// to the existing Cloudflare backend after the user presses Send.
const voiceBtn = document.getElementById("voiceBtn");
const voiceLanguage = document.getElementById("voiceLanguage");
const voiceStatus = document.getElementById("voiceStatus");
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isListening = false;
if (!SpeechRecognition) {
  voiceBtn.title = "Voice input is not supported in this browser";
  voiceStatus.textContent = "Voice input is not supported here. Try Chrome on Android.";
  voiceBtn.addEventListener("click", () => {
    voiceStatus.textContent = "Try opening this file in Chrome. Microphone access may not work in every file preview.";
  });
} else {
  recognition = new SpeechRecognition();
  recognition.lang = "en-IN";
  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.maxAlternatives = 1;
  recognition.onstart = () => {
    isListening = true;
    voiceBtn.classList.add("listening");
    voiceBtn.textContent = "⏹";
    voiceBtn.setAttribute("aria-label", "Stop voice input");
    voiceStatus.textContent = "Listening… speak now";
  };
  recognition.onresult = event => {
    let finalText = "", interimText = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
      else interimText += event.results[i][0].transcript;
    }
    if (finalText) {
      input.value = (input.value.trim() ? input.value.trim() + " " : "") + finalText.trim();
      input.dispatchEvent(new Event("input", {bubbles:true}));
      voiceStatus.textContent = "Voice captured. Review your message, then tap Send.";
    } else if (interimText) {
      voiceStatus.textContent = "Hearing: " + interimText;
    }
  };
  recognition.onerror = event => {
    const messages = {
      "not-allowed":"Microphone permission was blocked. Allow it in your browser settings.",
      "no-speech":"No speech was detected. Tap the microphone and try again.",
      "network":"Speech recognition needs a network connection in this browser."
    };
    voiceStatus.textContent = messages[event.error] || ("Voice input error: " + event.error);
  };
  recognition.onend = () => {
    isListening = false;
    voiceBtn.classList.remove("listening");
    voiceBtn.textContent = "🎙️";
    voiceBtn.setAttribute("aria-label", "Start voice input");
    if (voiceStatus.textContent === "Listening… speak now") voiceStatus.textContent = "Voice input stopped.";
  };
  voiceBtn.addEventListener("click", () => {
    if (isListening) recognition.stop();
    else {
      try {
        recognition.lang = voiceLanguage ? voiceLanguage.value : "en-IN";
        recognition.start();
      } catch (error) {
        voiceStatus.textContent = "Could not start the microphone. Wait a moment and try again.";
      }
    }
  });
}


const logoSVG = `<svg class="logo-mark" viewBox="0 0 100 100" role="img" aria-label="NEXORA logo"><defs><linearGradient id="chatLogoGrad" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#287dff"/><stop offset=".52" stop-color="#9b45ff"/><stop offset="1" stop-color="#ed63ff"/></linearGradient></defs><rect x="3" y="3" width="94" height="94" rx="28" fill="#24135a" stroke="#7042e8" stroke-opacity=".55"/><path d="M24 72V28L76 72V28" fill="none" stroke="url(#chatLogoGrad)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

function loadSessions() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const parsed = saved ? JSON.parse(saved) : [];
    return Array.isArray(parsed) ? parsed.filter(s => s && typeof s.id === "string" && Array.isArray(s.messages)) : [];
  } catch (error) {
    return [];
  }
}
function saveSessions() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
    return true;
  } catch (error) {
    alert("Chat history could not be saved by this preview. Try opening the HTML in a browser or Acode preview with storage enabled.");
    return false;
  }
}
function makeId() {
  return "chat_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
}
function currentSession() {
  return sessions.find(s => s.id === activeSessionId) || null;
}
function ensureSession(firstMessage = "") {
  let session = currentSession();
  if (!session) {
    session = { id: makeId(), title: firstMessage.trim().slice(0, 36) || "New chat", updatedAt: Date.now(), messages: [] };
    sessions.unshift(session);
    activeSessionId = session.id;
  } else if (session.messages.length === 0 && firstMessage.trim()) {
    session.title = firstMessage.trim().slice(0, 36);
  }
  session.updatedAt = Date.now();
  saveSessions();
  renderHistory();
  return session;
}
function renderHistory() {
  historyList.innerHTML = "";
  if (!sessions.length) {
    const empty = document.createElement("div");
    empty.style.cssText = "padding:5px 12px;color:#727ba8;font-size:12px";
    empty.textContent = "Your chats will appear here";
    historyList.appendChild(empty);
    return;
  }
  sessions.slice().sort((a,b) => b.updatedAt - a.updatedAt).forEach(session => {
    const row = document.createElement("div");
    row.style.cssText = "display:flex;align-items:center;gap:2px";
    const open = document.createElement("button");
    open.className = "history-item" + (session.id === activeSessionId ? " active" : "");
    open.innerHTML = '<span class="history-symbol">◷</span><span></span>';
    open.querySelector("span:nth-child(2)").textContent = session.title || "New chat";
    open.addEventListener("click", () => openSession(session.id));
    const rename = document.createElement("button");
    rename.className = "history-delete";
    rename.type = "button";
    rename.title = "Rename this chat";
    rename.setAttribute("aria-label", "Rename this chat");
    rename.textContent = "✎";
    rename.addEventListener("click", event => {
      event.stopPropagation();
      const next = prompt("Enter a new title for this chat:", session.title || "New chat");
      if (next === null) return;
      const title = next.trim().slice(0, 80);
      if (!title) { alert("Chat title cannot be empty."); return; }
      session.title = title;
      session.updatedAt = Date.now();
      saveSessions();
      renderHistory();
    });
    const del = document.createElement("button");
    del.className = "history-delete";
    del.type = "button";
    del.title = "Delete this chat";
    del.setAttribute("aria-label", "Delete this chat");
    del.textContent = "×";
    del.addEventListener("click", event => {
      event.stopPropagation();
      if (!confirm("Delete this conversation? This cannot be undone.")) return;
      sessions = sessions.filter(s => s.id !== session.id);
      if (activeSessionId === session.id) activeSessionId = null;
      saveSessions();
      if (!activeSessionId) showWelcome();
      renderHistory();
    });
    row.append(open, rename, del);
    historyList.appendChild(row);
  });
}
function showWelcome() {
  chat.innerHTML = "";
  chat.appendChild(welcome);
  welcome.style.display = "block";
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[ch]));
}
function inlineMarkdown(value) {
  let s = escapeHTML(value);
  // Protect inline code before formatting other Markdown.
  const code = [];
  s = s.replace(/`([^`\n]+)`/g, (_, body) => {
    const key = "\u0000CODE" + code.length + "\u0000";
    code.push("<code>" + body + "</code>");
    return key;
  });
  s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  s = s.replace(/__(.+?)__/g, "<strong>$1</strong>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  s = s.replace(/(^|[^_])_([^_\n]+)_/g, "$1<em>$2</em>");
  return s.replace(/\u0000CODE(\d+)\u0000/g, (_, n) => code[Number(n)]);
}
function renderMarkdown(raw) {
  const lines = String(raw).replace(/\r\n?/g, "\n").split("\n");
  const out = [];
  let paragraph = [], listType = "", inCode = false, codeLines = [];
  const flushParagraph = () => {
    if (paragraph.length) {
      out.push("<p>" + inlineMarkdown(paragraph.join("\n")).replace(/\n/g, "<br>") + "</p>");
      paragraph = [];
    }
  };
  const closeList = () => {
    if (listType) { out.push("</" + listType + ">"); listType = ""; }
  };
  for (const line of lines) {
    if (/^\s*```/.test(line)) {
      flushParagraph(); closeList();
      if (inCode) {
        out.push("<pre><code>" + escapeHTML(codeLines.join("\n")) + "</code></pre>");
        codeLines = []; inCode = false;
      } else inCode = true;
      continue;
    }
    if (inCode) { codeLines.push(line); continue; }
    if (!line.trim()) { flushParagraph(); closeList(); continue; }
    const heading = line.match(/^\s{0,3}(#{1,3})\s+(.+)$/);
    if (heading) {
      flushParagraph(); closeList();
      const level = heading[1].length;
      out.push("<h" + level + ">" + inlineMarkdown(heading[2]) + "</h" + level + ">");
      continue;
    }
    if (/^\s{0,3}([-*_]\s*){3,}$/.test(line.trim())) {
      flushParagraph(); closeList(); out.push("<hr>"); continue;
    }
    const quote = line.match(/^\s*>\s?(.*)$/);
    if (quote) {
      flushParagraph(); closeList();
      out.push("<blockquote>" + inlineMarkdown(quote[1]) + "</blockquote>");
      continue;
    }
    const ul = line.match(/^\s*[-*+]\s+(.+)$/);
    const ol = line.match(/^\s*\d+[.)]\s+(.+)$/);
    if (ul || ol) {
      flushParagraph();
      const wanted = ul ? "ul" : "ol";
      if (listType !== wanted) { closeList(); listType = wanted; out.push("<" + listType + ">"); }
      out.push("<li>" + inlineMarkdown((ul || ol)[1]) + "</li>");
      continue;
    }
    closeList(); paragraph.push(line);
  }
  if (inCode) out.push("<pre><code>" + escapeHTML(codeLines.join("\n")) + "</code></pre>");
  flushParagraph(); closeList();
  return out.join("");
}

function addMessage(role, text, options = {}) {
  if (welcome && welcome.parentElement === chat) welcome.style.display = "none";
  const row = document.createElement("div");
  row.className = "message-row " + (role === "user" ? "user" : "bot");
  if (role !== "user") row.innerHTML = logoSVG;
  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  if (options.typing) {
    bubble.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    bubble.setAttribute("aria-label", "Thinking");
  } else if (role === "bot") {
    bubble.innerHTML = renderMarkdown(text);
  } else {
    bubble.textContent = text;
  }
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = role === "user" ? "You" : "NEXORA AI";
  wrap.append(bubble, meta);
  if (role === "bot" && !options.typing) {
    const actions = document.createElement("div");
    actions.className = "message-actions";
    const copy = document.createElement("button");
    copy.type = "button";
    copy.textContent = "Copy reply";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(String(text));
        copy.textContent = "Copied!";
      } catch (_) {
        const temp = document.createElement("textarea");
        temp.value = String(text);
        temp.style.position = "fixed"; temp.style.opacity = "0";
        document.body.appendChild(temp); temp.select();
        const ok = document.execCommand("copy"); temp.remove();
        copy.textContent = ok ? "Copied!" : "Select and copy manually";
      }
      setTimeout(() => { copy.textContent = "Copy reply"; }, 1600);
    });
    actions.appendChild(copy);
    wrap.appendChild(actions);
  }
  row.appendChild(wrap);
  chat.appendChild(row);
  chat.scrollTop = chat.scrollHeight;
  return {row, bubble, meta};
}
function renderSession(session) {
  chat.innerHTML = "";
  if (!session || !session.messages.length) {
    chat.appendChild(welcome);
    welcome.style.display = "block";
    return;
  }
  session.messages.forEach(msg => addMessage(msg.role, msg.text));
  chat.scrollTop = chat.scrollHeight;
}
function openSession(id) {
  activeSessionId = id;
  renderSession(currentSession());
  renderHistory();
  sidebar.classList.remove("open");
}
function startNewChat() {
  activeSessionId = null;
  showWelcome();
  renderHistory();
  sidebar.classList.remove("open");
  input.focus();
}
async function sendMessage(text) {
  const message = text.trim();
  if (!message || busy) return;
  busy = true;
  sendBtn.disabled = true;
  const session = ensureSession(message);
  session.messages.push({role: "user", text: message});
  session.updatedAt = Date.now();
  saveSessions();
  renderHistory();
  addMessage("user", message);
  input.value = "";
  input.style.height = "auto";
  const typing = addMessage("bot", "", {typing:true});
  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Server error (" + response.status + ").");
    if (!data.reply) throw new Error(data.error || "The AI returned an empty reply.");
    typing.bubble.innerHTML = renderMarkdown(data.reply);
    session.messages.push({role: "bot", text: data.reply});
  } catch (error) {
    const errorText = "I couldn't connect to NEXORA AI. " + (error.message || "Please try again.");
    typing.bubble.innerHTML = renderMarkdown(errorText);
    session.messages.push({role: "bot", text: errorText});
  } finally {
    session.updatedAt = Date.now();
    saveSessions();
    renderHistory();
    busy = false;
    sendBtn.disabled = false;
    chat.scrollTop = chat.scrollHeight;
    input.focus();
  }
}
form.addEventListener("submit", event => {
  event.preventDefault();
  sendMessage(input.value);
});
input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 150) + "px";
});
input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    form.requestSubmit();
  }
});
document.querySelectorAll(".suggestion").forEach(button => {
  button.addEventListener("click", () => sendMessage(button.textContent));
});
document.getElementById("newChat").addEventListener("click", startNewChat);
document.getElementById("menuBtn").addEventListener("click", () => sidebar.classList.toggle("open"));
document.getElementById("exploreBtn").addEventListener("click", () => {
  sendMessage("What are some useful things you can help me with?");
  sidebar.classList.remove("open");
});
document.getElementById("themeBtn").addEventListener("click", () => {
  const light = document.body.dataset.theme !== "light";
  document.body.dataset.theme = light ? "light" : "dark";
  if (light) {
    document.body.style.setProperty("--bg", "#f3f4ff");
    document.body.style.setProperty("--text", "#19152d");
    document.body.style.setProperty("--muted", "#646b91");
    document.body.style.setProperty("--panel2", "#e5e3ff");
    document.body.style.background = "#f3f4ff";
  } else {
    document.body.style.setProperty("--bg", "#0c0e1d");
    document.body.style.setProperty("--text", "#f5f6ff");
    document.body.style.setProperty("--muted", "#9da5dc");
    document.body.style.setProperty("--panel2", "#1b1f3a");
    document.body.style.background = "radial-gradient(ellipse at 80% 0%,#1a1740 0%,transparent 38%),#0c0e1d";
  }
});

// Restore the most recently used conversation on page load.
renderHistory();

// Chat backup tools: export/import JSON and clear all local conversations.
const exportChatsBtn = document.getElementById("exportChatsBtn");
const importChatsBtn = document.getElementById("importChatsBtn");
const importChatsFile = document.getElementById("importChatsFile");
const clearChatsBtn = document.getElementById("clearChatsBtn");
exportChatsBtn?.addEventListener("click", () => {
  const blob = new Blob([JSON.stringify({app:"NEXORA AI",version:1,exportedAt:new Date().toISOString(),sessions}, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "nexora-ai-chat-backup.json"; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});
importChatsBtn?.addEventListener("click", () => importChatsFile?.click());
importChatsFile?.addEventListener("change", async () => {
  const file = importChatsFile.files && importChatsFile.files[0];
  if (!file) return;
  try {
    const parsed = JSON.parse(await file.text());
    const incoming = Array.isArray(parsed) ? parsed : parsed.sessions;
    if (!Array.isArray(incoming)) throw new Error("This file does not contain a NEXORA AI chat backup.");
    const clean = incoming.filter(s => s && typeof s.id === "string" && Array.isArray(s.messages))
      .map(s => ({
        id: s.id, title: String(s.title || "Imported chat").slice(0,80),
        updatedAt: Number(s.updatedAt) || Date.now(),
        messages: s.messages.filter(m => m && ["user","bot"].includes(m.role) && typeof m.text === "string")
          .map(m => ({role:m.role,text:m.text}))
      }));
    if (!clean.length) throw new Error("No valid conversations were found in that backup.");
    if (!confirm("Import " + clean.length + " conversations? Existing chats with matching IDs will be replaced.")) return;
    const map = new Map(sessions.map(s => [s.id,s]));
    clean.forEach(s => map.set(s.id,s));
    sessions = Array.from(map.values()).sort((a,b) => b.updatedAt-a.updatedAt);
    saveSessions(); renderHistory();
    alert("Chat backup imported successfully.");
  } catch (err) { alert("Could not import this backup: " + (err.message || "Invalid file")); }
  finally { importChatsFile.value = ""; }
});
clearChatsBtn?.addEventListener("click", () => {
  if (!sessions.length) { alert("There are no saved chats to clear."); return; }
  if (!confirm("Delete ALL saved NEXORA AI conversations from this browser? Export a backup first if you may need them.")) return;
  sessions = []; activeSessionId = null; saveSessions(); showWelcome(); renderHistory();
});

if (sessions.length) {
  const mostRecent = sessions.slice().sort((a,b) => b.updatedAt - a.updatedAt)[0];
  openSession(mostRecent.id);
} else {
  showWelcome();
}
</script>
